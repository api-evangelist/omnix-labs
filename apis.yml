aid: omnix-labs
name: omniX labs
description: omniX labs is a New York-based AI machine-vision analytics company (owned by EverWash)
  serving car wash, oil-change/lube, and related quick-service automotive businesses. Its platform
  ingests real-time video of the physical business, applies computer vision and AI to synthesize
  customer interactions, and returns operational insights that help operators boost throughput,
  optimize staffing, prevent loss, predict demand, and grow revenue. omniX labs was surfaced as a
  Techstars portfolio company. It operates a customer web portal but publishes no public developer
  API, SDK, or technical documentation surface at this time.
